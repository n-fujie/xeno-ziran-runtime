[project]
name = "xzr"
version = "0.2.0"
description = "XENO ZIRAN SIMULATOR runtime: operational-shape simulation and experimental instruments for comparing configurations"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
]

authors = [{ name = "Naoto Fujie" }]

[project.scripts]
xzr = "xzr.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "websockets>=13"]
physics = ["mujoco==3.14.0"]  # xzr.lab.physics (physical laboratory runs); pinned like ziran-xeno-simulator/embodied

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xzr*"]

[tool.setuptools.package-data]
xzr = ["presets/*.json", "_compat/hierarchies/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "A", "BLE"]
ignore = ["E731", "SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
# generated prose (Methods / Results text) is kept as readable sentences
"xzr/study/report.py" = ["E501"]
"xzr/study/ards.py" = ["E501"]
"xzr/study/perf.py" = ["E501"]
"xzr/study/variables.py" = ["E501"]
"xzr/study/shared/*.py" = ["E501"]
"xzr/lab/multisystem.py" = ["E501"]
"xzr/study/protocol.py" = ["E501"]
"xzr/study/templates.py" = ["E501"]
"tests/test_study_ards.py" = ["E501"]
"tests/test_study_shared.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
