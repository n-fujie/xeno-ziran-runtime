[project]
name = "xzr"
version = "0.1.0"
description = "Xeno / Ziran Philosophical Runtime — Operational Shape Simulation Platform (backend)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "websockets>=13"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xzr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "A", "BLE"]
ignore = ["E731", "SIM108", "B905"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
