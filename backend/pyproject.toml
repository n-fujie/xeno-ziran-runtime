[project]
name = "xzr"
version = "0.2.0"
description = "XENO ZIRAN SIMULATOR runtime: operational-shape simulation and experimental instruments for comparing configurations"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
]

authors = [{ name = "Naoto Fujie" }]

[project.scripts]
xzr = "xzr.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "websockets>=13"]
physics = ["mujoco==3.14.0"]  # xzr.lab.physics (physical laboratory runs); pinned like ziran-xeno-simulator/embodied

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xzr*"]

[tool.setuptools.package-data]
xzr = ["presets/*.json", "_compat/hierarchies/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "A", "BLE"]
ignore = ["E731", "SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
# generated prose (Methods / Results text) is kept as readable sentences
"xzr/study/report.py" = ["E501"]
"xzr/study/ards.py" = ["E501"]
"xzr/study/perf.py" = ["E501"]
"xzr/study/variables.py" = ["E501"]
"xzr/study/boundaries.py" = ["E501"]
"xzr/study/nonredundancy.py" = ["E501"]
"xzr/study/power.py" = ["E501"]
"xzr/study/analysis.py" = ["E501"]
"xzr/meos/*.py" = ["E501"]
"xzr/service/meos.py" = ["E501"]
"tests/test_meos.py" = ["E501"]
"scripts/meos_experiments.py" = ["E501"]
"scripts/meos_experiments_v2.py" = ["E501"]
"scripts/visual_compare.py" = ["E501"]
"scripts/make_meos_fixture.py" = ["E501"]
"tests/test_meos_stage2.py" = ["E501"]
"xzr/hpo/reachability.py" = ["E501"]
"tests/test_study.py" = ["E501"]
"tests/test_hierarchy_diagnosis.py" = ["E501"]
"xzr/study/shared/*.py" = ["E501"]
"xzr/lab/multisystem.py" = ["E501"]
"xzr/totalobs/*.py" = ["E501"]
"xzr/study/totalobs_templates.py" = ["E501"]
"xzr/study/programme_templates.py" = ["E501"]
"xzr/lineage.py" = ["E501"]
"scripts/certify_studies.py" = ["E501"]
"scripts/protocol_audit.py" = ["E501"]
"scripts/audit_statistics.py" = ["E501"]
"scripts/evidence_check.py" = ["E501"]
"scripts/programme_audit.py" = ["E501"]
"scripts/comparators_audit.py" = ["E501"]
"xzr/service/studies.py" = ["E501"]  # prose docstrings and generated text
"tests/test_totalobs*.py" = ["E501"]
"tests/test_programmes.py" = ["E501"]
"xzr/study/protocol.py" = ["E501"]
"xzr/study/templates.py" = ["E501"]
"tests/test_study_ards.py" = ["E501"]
"tests/test_study_shared.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
