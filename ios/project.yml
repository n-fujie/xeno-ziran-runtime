# XENO ZIRAN SIMULATOR — iOS app. Generate the Xcode project with `xcodegen generate` (in ios/).
name: XenoZiranSimulator
options:
  bundleIdPrefix: io.platodesign
  deploymentTarget:
    iOS: "17.0"  # numpy's iOS wheels require iOS 17
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 4YPXSK4SM2
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # numpy's simulator wheel is arm64-only (Apple-silicon Macs)
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  XenoZiranSimulator:
    type: application
    platform: iOS
    sources:
      - path: XenoZiran
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - framework: vendor/py/Python.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.platodesign.xenoziransimulator
        PRODUCT_NAME: XenoZiranSimulator
        INFOPLIST_FILE: XenoZiran/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: XenoZiran/Runtime/XenoZiran-Bridging-Header.h
        HEADER_SEARCH_PATHS: "\"$(BUILT_PRODUCTS_DIR)/Python.framework/Headers\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        DEAD_CODE_STRIPPING: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    postBuildScripts: []
    preBuildScripts: []
    buildToolPlugins: []
    postCompileScripts:
      - name: Install on-device runtime
        script: |
          set -e
          sh "$PROJECT_DIR/scripts/install_runtime.sh"
        basedOnDependencyAnalysis: false
  XenoZiranSimulatorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [XenoZiranTests]
    dependencies:
      - target: XenoZiranSimulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.platodesign.xenoziransimulator.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XenoZiranSimulator.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/XenoZiranSimulator"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
  XenoZiranSimulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [XenoZiranUITests]
    dependencies:
      - target: XenoZiranSimulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.platodesign.xenoziransimulator.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: XenoZiranSimulator
        CODE_SIGN_STYLE: Automatic
schemes:
  XenoZiranSimulator:
    build:
      targets:
        XenoZiranSimulator: all
        XenoZiranSimulatorTests: [test]
        XenoZiranSimulatorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - XenoZiranSimulatorTests
        - XenoZiranSimulatorUITests
    archive:
      config: Release
